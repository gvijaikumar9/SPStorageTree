name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          # fresh runners have no PSResourceGet repository store yet, so trust per install instead of Set-PSResourceRepository
          Install-PSResource -Name PnP.PowerShell -Version '[3.0.0,4.0.0)' -TrustRepository -Quiet
          Install-PSResource -Name Pester -Version '[5.5.0,7.0.0)' -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Quiet

      - name: Build and analyze
        shell: pwsh
        run: ./build.ps1

      - name: Test
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed" }
